networks:
  devcontainer:
    internal: false
volumes:
  composer-cache:
  npm-cache:
services:
  devcontainer:
    build:
      context: './'
      dockerfile: './Dockerfile'
      target: 'devcontainer'
    command: 'sleep infinity'
    environment:
      APP_ENV: 'local'
      COMPOSER_CACHE_DIR: '/home/devcontainer/.composer/cache'
      NPM_CONFIG_CACHE: '/home/devcontainer/.npm'
      NODE_ENV: 'development'
    networks:
      - 'devcontainer'
    user: 'devcontainer:devcontainer'
    volumes:
      - './:/var/www/html'
      - 'composer-cache:/home/devcontainer/.composer/cache'
      - 'npm-cache:/home/devcontainer/.npm'
